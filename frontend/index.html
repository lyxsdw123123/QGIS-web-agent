<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QGIS Web Agent MVP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg:#f4f5f0; --panel:#fff; --line:#e2e4dc; --text:#1c241f; --muted:#667069;
            --accent:#0f766e; --blue:#1f5f8a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body,#app { height:100%; font-family:"Microsoft YaHei",system-ui,sans-serif; font-size:14px; color:var(--text); }
    #app { display:flex; }
    #map-wrap { flex:1; position:relative; }
    #map { position:absolute; inset:0; }
    #badge { position:absolute; top:10px; left:10px; z-index:1000; background:rgba(255,255,255,.92);
      padding:5px 10px; border-radius:8px; border:1px solid var(--line); font-size:12px; color:var(--muted); }
    #panel { position:absolute; top:10px; left:10px; z-index:1000; width:300px; background:rgba(255,255,255,.95);
      border:1px solid var(--line); border-radius:10px; padding:10px; max-height:calc(100% - 20px); overflow:auto; }
    #panel h4 { font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
    .layer-row { display:flex; align-items:center; gap:6px; padding:6px 4px; border-top:1px solid var(--line); font-size:13px; }
    .layer-row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .layer-row .name em { color:var(--muted); font-style:normal; font-size:11px; }
    .layer-row button { border:1px solid var(--line); background:#fff; border-radius:5px; padding:2px 8px;
      cursor:pointer; font-size:11px; }
    .layer-row button:hover { border-color:var(--accent); color:var(--accent); }
    .layer-row button.del:hover { border-color:#a33b32; color:#a33b32; }
    #toolbar { position:absolute; top:10px; right:10px; z-index:1000; display:flex; gap:6px; }
    #toolbar button { border:1px solid var(--line); background:rgba(255,255,255,.95); border-radius:8px;
      padding:7px 12px; cursor:pointer; font-size:13px; }
    #toolbar button:hover { border-color:var(--accent); color:var(--accent); }
    #chat { width:380px; flex:none; display:flex; flex-direction:column; background:var(--panel); border-left:1px solid var(--line); }
    #chat-head { padding:12px 14px; border-bottom:1px solid var(--line); font-weight:600; }
    #chat-head small { display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:2px; }
    #messages { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
    .msg { max-width:92%; padding:8px 11px; border-radius:10px; line-height:1.5; word-break:break-word; font-size:13px; }
    .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px; white-space:pre-wrap; }
    .msg.assistant { align-self:flex-start; background:var(--bg); border-bottom-left-radius:3px; }
    .msg.tool { align-self:flex-start; font-size:12px; color:var(--muted); }
    .msg.error { align-self:flex-start; color:#a33b32; background:#fbeceb; }
    .tool-card { align-self:flex-start; width:92%; border:1px solid var(--line); border-radius:10px;
      background:#fff; overflow:hidden; font-size:12px; }
    .tool-card .tc-head { display:flex; align-items:center; gap:6px; padding:6px 10px; background:var(--bg); }
    .tool-card .tc-name { color:var(--accent); font-weight:600; }
    .tool-card .tc-dur { margin-left:auto; color:var(--muted); font-size:11px; }
    .tool-card .tc-body { padding:5px 10px; color:var(--muted); word-break:break-all; font-size:11px; }
    .tool-card.error .tc-name { color:#a33b32; }
    .spinner { width:12px; height:12px; border:2px solid #ccc; border-top-color:var(--accent);
      border-radius:50%; animation:spin .8s linear infinite; flex:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #status-bar { padding:2px; font-size:12px; color:var(--muted); display:none; }
    #status-bar.show { display:block; }
    #composer { padding:10px 12px; border-top:1px solid var(--line); }
    #input-bar { display:flex; gap:8px; }
    #input { flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit; resize:none; outline:none; }
    #input:focus { border-color:var(--accent); }
    #send { border:0; background:var(--accent); color:#fff; border-radius:8px; padding:0 16px; cursor:pointer; font-size:13px; }
    #send:disabled { background:#b7c7bd; cursor:not-allowed; }
    .hint { margin-top:6px; font-size:11px; color:var(--muted); }
  </style>
</head>
<body>
<div id="app">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="badge">加载中…</div>
    <div id="toolbar">
      <button id="load-demo">加载示例道路</button>
      <button id="upload-btn">上传 GeoJSON</button>
      <input type="file" id="upload-input" accept=".geojson,.json" hidden>
    </div>
    <div id="panel">
      <h4>图层</h4>
      <div id="layer-list"><div style="font-size:12px;color:#999">暂无图层</div></div>
    </div>
  </div>
  <div id="chat">
    <div id="chat-head">GIS 助手<small id="chat-sub">对话驱动的空间分析</small></div>
    <div id="messages"></div>
    <div id="composer">
      <div id="status-bar"></div>
      <div id="input-bar">
        <textarea id="input" rows="2" placeholder="例如：获取武汉市江汉区的 DEM，计算坡度和山体阴影"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="hint">支持 17 个 GIS 工具。Enter 发送，Shift+Enter 换行。</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([30.55, 114.32], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

const layerGeos = {};   // id -> L.GeoJSON
const layerMetas = {};  // id -> meta

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) { let t = ''; try { t = await r.text(); } catch (e) {} throw new Error(t || ('HTTP ' + r.status)); }
  return r.json();
}

function addMsg(role, text) {
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  m.textContent = text;
  document.getElementById('messages').appendChild(m);
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

async function addLayer(meta) {
  if (layerGeos[meta.id]) return;
  layerMetas[meta.id] = meta;
  if (meta.layer_type === 'raster') {
    // 栅格以图片叠加显示：后端已把 GeoTIFF 转成 PNG，这里配上经纬度范围
    const ov = L.imageOverlay(`/api/layers/${meta.id}/file`, meta.bounds,
                              { opacity: 0.85 });
    ov.addTo(map);
    layerGeos[meta.id] = ov;
    try { map.fitBounds(meta.bounds); } catch (e) {}
    renderLayers();
    return;
  }
  // 投影坐标（米）不能叠加在经纬度底图上，只登记到图层列表
  if (meta.crs && meta.crs !== 'EPSG:4326') { renderLayers(); return; }
  const geo = await api(`/api/layers/${meta.id}/data.geojson`);
  const gl = L.geoJSON(geo, { style: { color: '#1f5f8a', weight: 3 } });
  gl.addTo(map);
  layerGeos[meta.id] = gl;
  try { map.fitBounds(gl.getBounds()); } catch (e) {}
  renderLayers();
}

async function refreshLayers() {
  const { layers } = await api('/api/layers');
  for (const l of layers) await addLayer(l);
  renderLayers();
}

function renderLayers() {
  const list = document.getElementById('layer-list');
  const metas = Object.values(layerMetas).slice().reverse();
  if (!metas.length) { list.innerHTML = '<div style="font-size:12px;color:#999">暂无图层</div>'; return; }
  list.innerHTML = '';
  metas.forEach(l => {
    const row = document.createElement('div');
    row.className = 'layer-row';
    const name = document.createElement('span');
    name.className = 'name';
    const info = l.layer_type === 'raster'
      ? '栅格'
      : `${l.feature_count}要素${(l.crs && l.crs !== 'EPSG:4326') ? ' · ' + l.crs : ''}`;
    name.innerHTML = `${escapeHtml(l.name)} <em>${info}</em>`;
    name.title = `id=${l.id}`;
    const eye = document.createElement('button');
    eye.textContent = '隐藏';
    eye.onclick = () => { const g = layerGeos[l.id]; if (!g) return;
      map.hasLayer(g) ? (map.removeLayer(g), eye.textContent='显示') : (map.addLayer(g), eye.textContent='隐藏'); };
    const fit = document.createElement('button');
    fit.textContent = '定位';
    fit.onclick = () => { const g = layerGeos[l.id]; if (g) map.fitBounds(g.getBounds()); };
    const dl = document.createElement('button');
    dl.textContent = '下载';
    dl.onclick = () => { window.location = `/api/layers/${l.id}/download`; };
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '删除';
    del.onclick = async () => {
      await api(`/api/layers/${l.id}`, { method: 'DELETE' });
      if (layerGeos[l.id]) { map.removeLayer(layerGeos[l.id]); delete layerGeos[l.id]; }
      delete layerMetas[l.id];
      renderLayers();
    };
    row.append(name, eye, fit, dl, del);
    list.appendChild(row);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const toolCards = {};   // tool id -> {card, dur}

function prettyTool(name) {
  const m = { buffer: '缓冲区', points_along_lines: '沿线采样', clip: '裁剪',
    extract_by_attribute: '按属性筛选', reproject: '重投影', total_length: '长度统计',
    field_stats: '字段统计', inspect_layer: '检查图层', layer_to_geojson: '转GeoJSON',
    load_layer: '加载图层', get_osm_roads: 'OSM道路', get_admin_boundary: '行政区划',
    get_dem: '获取DEM', slope: '坡度', aspect: '坡向', hillshade: '山体阴影',
    render_png: '渲染图' };
  return m[name] || name;
}

function showStatus(text) {
  const s = document.getElementById('status-bar');
  if (text) { s.textContent = '⏳ ' + text; s.classList.add('show'); }
  else s.classList.remove('show');
}

function scrollMsgs() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }

function handleTool(d) {
  if (d.phase === 'start') {
    const card = document.createElement('div');
    card.className = 'tool-card';
    const head = document.createElement('div'); head.className = 'tc-head';
    const spin = document.createElement('span'); spin.className = 'spinner';
    const name = document.createElement('span'); name.className = 'tc-name';
    name.textContent = prettyTool(d.name);
    const dur = document.createElement('span'); dur.className = 'tc-dur';
    dur.textContent = '运行中…';
    head.append(spin, name, dur);
    const body = document.createElement('div'); body.className = 'tc-body';
    body.textContent = JSON.stringify(d.args);
    card.append(head, body);
    document.getElementById('messages').appendChild(card);
    toolCards[d.id] = { card, dur };
    scrollMsgs();
  } else {
    const c = toolCards[d.id];
    if (!c) return;
    c.card.classList.toggle('error', d.status !== 'ok');
    const sp = c.card.querySelector('.spinner'); if (sp) sp.remove();
    c.dur.textContent = (d.duration_ms / 1000).toFixed(1) + 's';
    const r = d.result || {};
    let sum = '';
    if (d.status !== 'ok') sum = r.error || '执行失败';
    else if (r.new_layer_name) sum = `生成图层「${r.new_layer_name}」`;
    else if (r.total_length_km != null) sum = `总长 ${r.total_length_km} km`;
    else if (r.feature_count != null) sum = `${r.feature_count} 要素`;
    else if (r.png_url) sum = '已出图';
    else if (r.fields) sum = `${Object.keys(r.fields).length} 个字段`;
    if (sum) { const b = document.createElement('div'); b.className = 'tc-body'; b.textContent = sum; c.card.appendChild(b); }
    scrollMsgs();
  }
}

function dispatchSSE(chunk) {
  let event = 'message', data = '';
  for (const line of chunk.split('\n')) {
    if (line.startsWith(':')) continue;
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trimStart();
  }
  if (!data) return;
  const d = JSON.parse(data);
  if (event === 'status') showStatus(d.text);
  else if (event === 'tool') handleTool(d);
  else if (event === 'layer') addLayer(d);
  else if (event === 'final') { showStatus(''); addMsg('assistant', d.text); }
  else if (event === 'error') { showStatus(''); addMsg('error', d.message); }
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  const btn = document.getElementById('send');
  btn.disabled = true;
  showStatus('已收到，正在理解需求…');
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!resp.ok) { addMsg('error', 'HTTP ' + resp.status); return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        dispatchSSE(buf.slice(0, idx));
        buf = buf.slice(idx + 2);
      }
    }
  } catch (e) {
    showStatus('');
    addMsg('error', '连接中断：' + e.message);
  } finally {
    btn.disabled = false;
    showStatus('');
  }
}

document.getElementById('send').onclick = send;
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.getElementById('load-demo').onclick = async () => {
  addMsg('tool', '加载示例道路…');
  try { await api('/api/demo/load', { method: 'POST' }); await refreshLayers(); addMsg('assistant', '已加载示例道路（武汉）。'); }
  catch (e) { addMsg('error', e.message); }
};

document.getElementById('upload-btn').onclick = () => document.getElementById('upload-input').click();
document.getElementById('upload-input').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  try { await api('/api/layers', { method: 'POST', body: fd }); await refreshLayers(); addMsg('assistant', `已上传并加载「${f.name}」。`); }
  catch (err) { addMsg('error', err.message); }
});

(async function boot() {
  try {
    const cfg = await api('/api/config');
    const badge = document.getElementById('badge');
    badge.textContent = `引擎：QGIS · 模型：${cfg.model} · ${cfg.has_api_key ? 'LLM 已连接' : '未配置 API key'}`;
    document.getElementById('chat-sub').textContent = '对话驱动的空间分析';
    await refreshLayers();
  } catch (e) {
    document.getElementById('badge').textContent = '后端未连接';
  }
})();
</script>
</body>
</html>
